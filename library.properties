sentence=DMX und RDM mit einem ESP32 senden und empfangen.
paragraph=Diese Bibliothek ermöglicht das Senden und Empfangen von ANSI-ESTA E1.11 DMX-512A und ANSI-ESTA E1.20 RDM mit einem Espressif ESP32. Sie bietet Kontrolle und Analyse der Paketkonfiguration und erlaubt synchrones oder asynchrones Lesen und Schreiben auf dem DMX-Bus über den gewünschten Hardware-UART-Port. Zusätzlich enthält sie Werkzeuge zur Fehlerprüfung und zur Extraktion von DMX-Paket-Metadaten für eine einfachere Fehlersuche.
category=Communication
